name: test

on:
  pull_request:
  push:
    branches: [main]

env:
  # CI-only secret — global-setup mints its session cookie from the same env
  # var the build bakes in, so any value works as long as it's consistent.
  SESSION_SECRET: ci-only-session-secret

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright, sandboxed content)
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
